<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>构建工作台 · 交互原型</title>
  <link rel="stylesheet" href="workbench.css">
  <script defer src="workbench.js"></script>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="box" viewBox="0 0 16 16"><path d="m8 1.7 6 3.3v6l-6 3.3L2 11V5zM2 5l6 3.4L14 5M8 8.4v5.9M5 3.4l6 3.3"/></symbol>
    <symbol id="play" viewBox="0 0 16 16"><path d="M5 2.8v10.4L13 8z" fill="currentColor" stroke-linejoin="round"/></symbol>
    <symbol id="moon" viewBox="0 0 16 16"><path d="M13.8 9.8A6 6 0 0 1 6.3 2a6.1 6.1 0 1 0 7.5 7.8Z"/></symbol>
    <symbol id="sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1v2m0 10v2M1 8h2m10 0h2M3 3l1.4 1.4m7.2 7.2L13 13M3 13l1.4-1.4m7.2-7.2L13 3"/></symbol>
    <symbol id="refresh" viewBox="0 0 16 16"><path d="M13.5 7A5.6 5.6 0 1 0 13 11M10 6.8l3.6.4.5-3.6"/></symbol>
    <symbol id="search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="m10 10 3.5 3.5"/></symbol>
    <symbol id="probe" viewBox="0 0 16 16"><path d="M6 2h4M7 2v4l-3.8 6A1.2 1.2 0 0 0 4.3 14h7.4a1.2 1.2 0 0 0 1.1-2L9 6V2M5.2 9h5.6"/></symbol>
    <symbol id="chevron" viewBox="0 0 16 16"><path d="m5 3 5 5-5 5"/></symbol>
    <symbol id="check" viewBox="0 0 16 16"><path d="m3 8.5 3.1 3.1L13 4.8"/></symbol>
    <symbol id="warn" viewBox="0 0 16 16"><path d="M7.2 2.9a.9.9 0 0 1 1.6 0l5.3 9a1 1 0 0 1-.8 1.5H2.7a1 1 0 0 1-.8-1.5zM8 6v3m0 1.8v.1"/></symbol>
    <symbol id="info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.2v3.5M8 5v.1"/></symbol>
    <symbol id="terminal" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="m4 5.5 2.3 2.1L4 10m4 0h3.4"/></symbol>
    <symbol id="save" viewBox="0 0 16 16"><path d="M3 2.5h8.5L14 5v8.5H2V2.5h1zm2.5 0v4h5v-4M5.5 13.5v-4h5v4"/></symbol>
    <symbol id="wrench" viewBox="0 0 16 16"><path d="m9.5 2.1-2 2 .5 2.2 2.2.5 2-2a4 4 0 0 1-5 5l-3.6 3.6a1.4 1.4 0 0 1-2-2l3.6-3.6a4 4 0 0 1 4.3-5.7z"/></symbol>
    <symbol id="stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1"/></symbol>
  </svg>
  <header class="mast">
    <div class="identity"><span class="mark"><svg class="icon"><use href="#box"/></svg></span><h1>构建工作台</h1></div>
    <div class="scenario"><label for="scenario">演示工作区</label><select id="scenario"><option value="vofa">vofa_bridge</option><option value="alkaa">alkaa</option></select></div>
    <div class="mast-end"><span class="prototype-tag"><i></i>交互原型</span><button id="theme" class="icon-btn" aria-label="切换亮色主题" title="切换亮色主题"><svg class="icon"><use href="#sun"/></svg></button></div>
  </header>
  <div class="toolbar">
    <div class="breadcrumbs"><span id="family"></span><svg class="icon"><use href="#chevron"/></svg><strong id="current-target"></strong></div>
    <span class="tool-status" id="toolbar-status" role="status"></span>
    <button id="primary" class="primary"><svg class="icon"><use href="#play"/></svg><span></span></button>
  </div>
  <nav class="compact-tabs tabs" aria-label="工作区分区">
    <button data-pane="navigator">目标</button><button data-pane="editor" aria-pressed="true">配置</button><button data-pane="inspector">工具链</button>
  </nav>
  <div id="work-area" class="work-area" data-pane="editor">
    <aside class="pane navigator" aria-label="构建导航">
      <div class="rail-head"><div class="tabs" aria-label="导航内容"><button data-nav="targets" aria-pressed="true">目标 <span id="target-count" class="count"></span></button><button data-nav="saved" aria-pressed="false">已保存</button></div><button class="icon-btn" id="refresh" aria-label="刷新目标" title="刷新目标"><svg class="icon"><use href="#refresh"/></svg></button></div>
      <label id="search-box" class="search-box"><svg class="icon"><use href="#search"/></svg><input id="target-search" type="search" aria-label="搜索任务或路径" placeholder="搜索任务或路径"></label>
      <div id="target-list" class="pane-scroll nav-list"></div>
    </aside>
    <main class="pane editor" aria-label="运行配置">
      <div class="panel-head"><h2>运行配置</h2><span class="muted" id="draft-label">临时配置</span></div>
      <div class="pane-scroll editor-body">
        <div id="notice" class="notice" aria-live="polite"></div>
        <div class="target-heading"><svg class="icon" id="editor-icon"><use href="#probe"/></svg><div><h3 id="editor-title"></h3><p id="source"></p></div><span class="badge" id="target-type"></span></div>
        <div class="fields">
          <label for="arguments">命令选项</label><div class="field-row"><input id="arguments" class="mono" autocomplete="off" spellcheck="false" placeholder="留空使用项目默认值"><button id="example" class="secondary">填入示例</button></div>
          <span></span><div id="field-note" class="muted"></div>
          <label for="config-name">配置名称</label><div class="field-row"><input id="config-name" placeholder="如：本地 Release" maxlength="70"><button id="save" class="secondary" disabled><svg class="icon"><use href="#save"/></svg>保存</button></div>
        </div>
        <details class="extra"><summary>附加产物路径 <span class="muted">可选</span></summary><label for="extra-paths" class="muted">每行一个工作区相对路径</label><textarea id="extra-paths" rows="2" placeholder="dist/"></textarea></details>
        <section class="command" aria-labelledby="command-title"><div class="command-head"><h4 id="command-title"><svg class="icon"><use href="#terminal"/></svg>命令预览</h4><span class="muted">工作目录 <code id="working-dir"></code></span></div><pre id="command"></pre></section>
      </div>
    </main>
    <aside class="pane inspector" aria-label="工作区工具链">
      <div class="panel-head"><h2><svg class="icon"><use href="#wrench"/></svg>工具链</h2><span class="muted" id="tool-count"></span></div>
      <div class="pane-scroll tools-body">
        <div class="tool-requirement"><h3 id="requirement"></h3><p id="tool-explanation"></p></div>
        <div class="tool-actions"><button id="verify" class="secondary"><svg class="icon"><use href="#check"/></svg><span>检查所选工具</span></button><p id="verify-summary" aria-live="polite"></p></div>
        <div id="tool-list" class="tool-list" aria-label="工具候选"></div>
      </div>
    </aside>
  </div>
  <section class="dock" aria-label="运行面板">
    <div class="dock-head"><div class="tabs dock-tabs" aria-label="运行面板内容"><button data-dock="output" aria-pressed="true"><svg class="icon"><use href="#terminal"/></svg>输出</button><button data-dock="history" aria-pressed="false">记录 <span id="run-count" class="count"></span></button><button data-dock="artifacts" aria-pressed="false">产物</button></div><button id="stop-run" class="secondary" hidden><svg class="icon"><use href="#stop"/></svg>停止</button><span id="run-status" class="badge"></span></div>
    <div id="dock-body" class="dock-body"></div>
  </section>
  <footer><span><i></i>本地演示 · 不执行命令</span><span id="footer-context"></span></footer>
  <dialog id="confirm"><div class="dialog-body"><h2>确认 Gradle 任务</h2><p>核对任务、工作目录和启动工具后再开始构建。</p><pre id="confirm-command"></pre><p id="confirm-context"></p><form method="dialog"><button class="secondary" value="cancel">取消</button><button class="primary" value="build">确认构建</button></form></div></dialog>
</body>
</html>
